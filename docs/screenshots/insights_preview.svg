<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .phone-frame { fill: #1e293b; rx: 40px; ry: 40px; stroke: #334155; stroke-width: 4px; }
      .screen-bg { fill: #f8fafc; rx: 32px; ry: 32px; }
      .header-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .header-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
      .card { fill: #ffffff; rx: 16px; ry: 16px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05)); }
      .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #0f172a; }
      .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
      .text-accent { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #0284c7; }
      .badge { rx: 8px; ry: 8px; fill: #e0f2fe; }
      .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #0369a1; }
      .chip { rx: 20px; ry: 20px; fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1px; }
      .chip-active { rx: 20px; ry: 20px; fill: #0284c7; }
      .chip-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #475569; }
      .chip-text-active { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #ffffff; }
      .nav-bar { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1px; }
      .nav-item { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #94a3b8; }
      .nav-item-active { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #0284c7; }
    </style>
  </defs>

  <rect width="600" height="1000" class="bg" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="540" height="960" class="phone-frame" />
    <rect x="12" y="12" width="516" height="936" class="screen-bg" />

    <!-- Status Bar -->
    <text x="40" y="45" font-family="system-ui" font-size="14" font-weight="600" fill="#0f172a">9:41</text>
    <path d="M470 38 h15 a5 5 0 0 1 5 5 v6 a5 5 0 0 1 -5 5 h-15 z" fill="none" stroke="#0f172a" stroke-width="2"/>
    <rect x="472" y="40" width="11" height="8" fill="#0f172a" rx="1"/>

    <!-- Header -->
    <text x="40" y="90" class="header-title">Insights &amp; Analytics</text>
    <text x="40" y="110" class="header-sub">November 2026</text>

    <!-- Top Metrics Cards -->
    <g transform="translate(40, 130)">
      <rect x="0" y="0" width="214" height="65" class="card" />
      <text x="15" y="25" class="text-sub">Top Category</text>
      <text x="15" y="48" class="text-main">Mamak <tspan font-weight="400" fill="#0284c7">RM 368.50</tspan></text>
    </g>
    <g transform="translate(266, 130)">
      <rect x="0" y="0" width="214" height="65" class="card" />
      <text x="15" y="25" class="text-sub">Top Merchant</text>
      <text x="15" y="48" class="text-main">Nasi Kandar <tspan font-weight="400" fill="#0284c7">RM 210.00</tspan></text>
    </g>

    <!-- Mode Filter Chips -->
    <g transform="translate(40, 210)">
      <rect x="0" y="0" width="115" height="32" class="chip-active" />
      <text x="57.5" y="21" text-anchor="middle" class="chip-text-active">180° Half Pie</text>

      <rect x="123" y="0" width="105" height="32" class="chip" />
      <text x="175.5" y="21" text-anchor="middle" class="chip-text">360° Donut</text>

      <rect x="236" y="0" width="100" height="32" class="chip" />
      <text x="286" y="21" text-anchor="middle" class="chip-text">Ranked Bars</text>

      <rect x="344" y="0" width="76" height="32" class="chip" />
      <text x="382" y="21" text-anchor="middle" class="chip-text">Timeline</text>
    </g>

    <!-- 180 Arch Half Pie Card -->
    <g transform="translate(40, 260)">
      <rect x="0" y="0" width="440" height="220" class="card" />
      <path d="M 90 160 A 100 100 0 0 1 350 160" fill="none" stroke="#f1f5f9" stroke-width="28" stroke-linecap="round"/>
      <path d="M 90 160 A 100 100 0 0 1 170 75" fill="none" stroke="#3b82f6" stroke-width="28" stroke-linecap="round"/>
      <path d="M 180 73 A 100 100 0 0 1 270 65" fill="none" stroke="#10b981" stroke-width="28" stroke-linecap="round"/>
      <path d="M 280 67 A 100 100 0 0 1 350 160" fill="none" stroke="#f59e0b" stroke-width="28" stroke-linecap="round"/>

      <g transform="translate(170, 95)">
        <rect x="0" y="0" width="100" height="55" rx="10" fill="#0f172a" />
        <text x="50" y="20" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#38bdf8">Gaming</text>
        <text x="50" y="36" text-anchor="middle" font-family="system-ui" font-size="10" fill="#cbd5e1">RM 192 (18%)</text>
        <rect x="25" y="42" width="50" height="18" rx="4" fill="#0284c7" />
        <text x="50" y="55" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="700" fill="#fff">+ Log</text>
      </g>
    </g>

    <!-- FlowRow Category Chips -->
    <g transform="translate(40, 495)">
      <rect x="0" y="0" width="85" height="28" class="badge" />
      <text x="42.5" y="18" text-anchor="middle" class="badge-text">Food 34%</text>

      <rect x="93" y="0" width="100" height="28" class="chip" />
      <text x="143" y="18" text-anchor="middle" class="chip-text">Transport 22%</text>

      <rect x="201" y="0" width="110" height="28" class="chip-active" />
      <text x="256" y="18" text-anchor="middle" class="chip-text-active">Gaming (Custom)</text>

      <rect x="319" y="0" width="105" height="28" class="chip" />
      <text x="371.5" y="18" text-anchor="middle" class="chip-text">Pets (Custom)</text>

      <g transform="translate(0, 36)">
        <rect x="0" y="0" width="85" height="28" class="chip" />
        <text x="42.5" y="18" text-anchor="middle" class="text-accent">+ Custom</text>
        <rect x="93" y="0" width="80" height="28" class="chip" />
        <text x="133" y="18" text-anchor="middle" class="chip-text">Manage</text>
      </g>
    </g>

    <!-- Dedicated Custom Categories Card -->
    <g transform="translate(40, 580)">
      <rect x="0" y="0" width="440" height="130" class="card" />
      <text x="20" y="30" class="text-main">Custom Categories</text>
      
      <g transform="translate(20, 50)">
        <circle cx="16" cy="16" r="16" fill="#e0f2fe"/>
        <text x="16" y="21" text-anchor="middle" font-size="14">🎮</text>
        <text x="45" y="16" class="text-main">Gaming</text>
        <text x="45" y="32" class="text-sub">Custom Badge</text>
        <text x="300" y="24" class="text-main">RM 192.00</text>
        <rect x="370" y="8" width="50" height="24" rx="6" fill="#0284c7" />
        <text x="395" y="24" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#fff">Log</text>
      </g>

      <line x1="20" y1="95" x2="420" y2="95" stroke="#f1f5f9" stroke-width="1"/>

      <g transform="translate(20, 105)">
        <circle cx="16" cy="16" r="16" fill="#fef3c7"/>
        <text x="16" y="21" text-anchor="middle" font-size="14">🐾</text>
        <text x="45" y="16" class="text-main">Pet Care</text>
        <text x="45" y="32" class="text-sub">Custom Badge</text>
        <text x="300" y="24" class="text-main">RM 148.00</text>
        <rect x="370" y="8" width="50" height="24" rx="6" fill="#0284c7" />
        <text x="395" y="24" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#fff">Log</text>
      </g>
    </g>

    <!-- Bottom Navigation Bar -->
    <g transform="translate(12, 856)">
      <rect x="0" y="0" width="516" height="80" class="nav-bar" rx="0" ry="0" />
      <g transform="translate(50, 15)">
        <text x="15" y="20" text-anchor="middle" font-size="18">🏠</text>
        <text x="15" y="45" text-anchor="middle" class="nav-item">Home</text>
      </g>
      <g transform="translate(150, 15)">
        <text x="15" y="20" text-anchor="middle" font-size="18">📜</text>
        <text x="15" y="45" text-anchor="middle" class="nav-item">Activity</text>
      </g>
      <g transform="translate(250, 12)">
        <circle cx="25" cy="20" r="22" fill="#e0f2fe"/>
        <text x="25" y="26" text-anchor="middle" font-size="18">📊</text>
        <text x="25" y="55" text-anchor="middle" class="nav-item-active">Insights</text>
      </g>
      <g transform="translate(350, 15)">
        <text x="15" y="20" text-anchor="middle" font-size="18">📷</text>
        <text x="15" y="45" text-anchor="middle" class="nav-item">Scanner</text>
      </g>
      <g transform="translate(450, 15)">
        <text x="15" y="20" text-anchor="middle" font-size="18">👥</text>
        <text x="15" y="45" text-anchor="middle" class="nav-item">Split</text>
      </g>
    </g>

  </g>
</svg>
