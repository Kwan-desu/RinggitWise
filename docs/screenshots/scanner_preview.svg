<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .phone-frame { fill: #1e293b; rx: 40px; ry: 40px; stroke: #334155; stroke-width: 4px; }
      .screen-bg { fill: #f8fafc; rx: 32px; ry: 32px; }
      .header-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .card { fill: #ffffff; rx: 16px; ry: 16px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05)); }
      .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #0f172a; }
      .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
      .toggle-bg { fill: #e2e8f0; rx: 20px; ry: 20px; }
      .toggle-active { fill: #0284c7; rx: 18px; ry: 18px; }
      .viewfinder { fill: rgba(15, 23, 42, 0.75); rx: 16px; ry: 16px; }
      .bbox { fill: none; stroke: #38bdf8; stroke-width: 2px; stroke-dasharray: 6 4; rx: 6px; ry: 6px; }
      .btn-primary { fill: #0284c7; rx: 12px; ry: 12px; }
      .btn-secondary { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1px; rx: 12px; ry: 12px; }
      .nav-bar { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1px; }
      .nav-item { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #94a3b8; }
      .nav-item-active { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #0284c7; }
    </style>
  </defs>

  <rect width="600" height="1000" class="bg" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="540" height="960" class="phone-frame" />
    <rect x="12" y="12" width="516" height="936" class="screen-bg" />

    <!-- Status Bar -->
    <text x="40" y="45" font-family="system-ui" font-size="14" font-weight="600" fill="#0f172a">9:41</text>
    <path d="M470 38 h15 a5 5 0 0 1 5 5 v6 a5 5 0 0 1 -5 5 h-15 z" fill="none" stroke="#0f172a" stroke-width="2"/>
    <rect x="472" y="40" width="11" height="8" fill="#0f172a" rx="1"/>

    <!-- Header -->
    <text x="40" y="90" class="header-title">Smart Receipt Scanner</text>
    <text x="40" y="110" class="text-sub">Dual-Engine AI Recognition</text>

    <!-- Engine Toggle Switch -->
    <g transform="translate(40, 135)">
      <rect x="0" y="0" width="440" height="46" class="toggle-bg" />
      <rect x="3" y="3" width="217" height="40" class="toggle-active" />
      <text x="111.5" y="27" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#ffffff">Local ML Kit (100% Offline)</text>
      <text x="332" y="27" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#64748b">Gemini AI</text>
    </g>

    <!-- Scan Viewfinder / Card -->
    <g transform="translate(40, 195)">
      <rect x="0" y="0" width="440" height="340" class="viewfinder" />
      
      <!-- Simulated Receipt Graphic Inside Viewfinder -->
      <g transform="translate(70, 30)">
        <rect x="0" y="0" width="300" height="280" fill="#ffffff" rx="8" />
        
        <!-- Receipt Header Bbox -->
        <rect x="20" y="20" width="260" height="45" class="bbox" />
        <text x="30" y="42" font-family="system-ui" font-size="12" font-weight="700" fill="#0369a1">Touch 'n Go / ZUS Coffee</text>
        <text x="30" y="58" font-family="system-ui" font-size="10" fill="#64748b">Merchant Detected</text>

        <!-- Date Bbox -->
        <rect x="20" y="75" width="120" height="35" class="bbox" />
        <text x="30" y="93" font-family="system-ui" font-size="11" font-weight="600" fill="#0f172a">2026-11-08</text>

        <!-- Amount Bbox -->
        <rect x="150" y="75" width="130" height="35" class="bbox" />
        <text x="160" y="93" font-family="system-ui" font-size="12" font-weight="700" fill="#16a34a">RM 13.90</text>

        <!-- Line items simulation -->
        <line x1="30" y1="130" x2="270" y2="130" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="30" y="155" font-family="system-ui" font-size="11" fill="#475569">1x Spanish Latte (Hot)</text>
        <text x="250" y="155" text-anchor="end" font-family="system-ui" font-size="11" fill="#475569">RM 13.90</text>

        <!-- Category Suggestion Badge -->
        <g transform="translate(20, 185)">
          <rect x="0" y="0" width="260" height="65" fill="#e0f2fe" rx="8" />
          <text x="15" y="24" font-family="system-ui" font-size="11" font-weight="700" fill="#0369a1">💡 Category Suggestion</text>
          <text x="15" y="46" font-family="system-ui" font-size="13" font-weight="600" fill="#0f172a">Food &amp; Drinks (Cafe)</text>
        </g>
      </g>
    </g>

    <!-- Detected Fields Summary Card -->
    <g transform="translate(40, 550)">
      <rect x="0" y="0" width="440" height="150" class="card" />
      <text x="20" y="30" class="text-main">Extracted Transaction Details</text>
      
      <g transform="translate(20, 50)">
        <text x="0" y="15" class="text-sub">Merchant</text>
        <text x="180" y="15" class="text-main">ZUS Coffee (TnG eWallet)</text>
        
        <text x="0" y="45" class="text-sub">Date &amp; Time</text>
        <text x="180" y="45" class="text-main">2026-11-08 14:22</text>

        <text x="0" y="75" class="text-sub">Total Amount</text>
        <text x="180" y="75" class="text-accent">RM 13.90</text>
      </g>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(40, 720)">
      <rect x="0" y="0" width="210" height="50" class="btn-secondary" />
      <text x="105" y="30" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="600" fill="#475569">Retake Scan</text>

      <rect x="230" y="0" width="210" height="50" class="btn-primary" />
      <text x="335" y="30" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="600" fill="#ffffff">Confirm &amp; Log</text>
    </g>

    <!-- Bottom Navigation Bar -->
    <g transform="translate(12, 856)">
      <rect x="0" y="0" width="516" height="80" class="nav-bar" rx="0" ry="0" />
      <g transform="translate(50, 15)">
        <text x="15" y="20" text-anchor="middle" font-size="18">🏠</text>
        <text x="15" y="45" text-anchor="middle" class="nav-item">Home</text>
      </g>
      <g transform="translate(150, 15)">
        <text x="15" y="20" text-anchor="middle" font-size="18">📜</text>
        <text x="15" y="45" text-anchor="middle" class="nav-item">Activity</text>
      </g>
      <g transform="translate(250, 15)">
        <text x="15" y="20" text-anchor="middle" font-size="18">📊</text>
        <text x="15" y="45" text-anchor="middle" class="nav-item">Insights</text>
      </g>
      <g transform="translate(350, 12)">
        <circle cx="25" cy="20" r="22" fill="#e0f2fe"/>
        <text x="25" y="26" text-anchor="middle" font-size="18">📷</text>
        <text x="25" y="55" text-anchor="middle" class="nav-item-active">Scanner</text>
      </g>
      <g transform="translate(450, 15)">
        <text x="15" y="20" text-anchor="middle" font-size="18">👥</text>
        <text x="15" y="45" text-anchor="middle" class="nav-item">Split</text>
      </g>
    </g>

  </g>
</svg>
